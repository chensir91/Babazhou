// ===== 损伤系统 =====
class Ail{constructor(t){this.t=t;this.s=0}add(n){this.s+=n;if(this.s>=10){this.s=0;return 1}return 0}}

// ===== 单位类 =====
class U{
constructor(c){
this.n=c.n;this.hp=c.h;this.mH=c.h;this.atk=c.a;this.agi=c.g;this.tm=c.t;this.x=c.x;this.y=c.y;
this.rg=c.r||[[0,0]];this.ch=0;this.mxC=c.m||5;this.sh=0;this.al=1;
this.st=0;this.bd=0;this.bl=0;this.sth=0;this.tt=0;this.inv=0;this.invT=0;
this.ail={neuro:new Ail('neuro'),fear:new Ail('fear'),burn:new Ail('burn')};
this.cd={};this.sto={};this.pv=c.p||[];this.sk=c.sk||[];this.cs=0;
this.cls=c.cls||'';this.isS=0;this.mst=null;
// 角色特有
this.qi=0;this.ult=0;this.fd=0;this.intel=0;this.gru=0;this.gTur=0;this.turCt=0;
this.rage=0;this.form=0;this.trees=[];this.mk=[];this.kC=0;this.dT=0;this.dd=0;
this.cc=[];this.elec='';this.xiaoy=0;this.bonus=0;this.autoSk=0;
}
dmg(v,p=0){
if(!this.al)return 0;let a=v;
if(!p&&this.sh>0){let b=this.sh;this.sh=Math.max(0,this.sh-a);a=Math.max(0,a-b)}
this.hp-=a;this.dT+=a;
if(this.hp<=0){this.hp=0;if(this.dd){this.delay=1;return a}this.al=0}
return a
}
heal(v){if(this.al)this.hp=Math.min(this.mH,this.hp+v)}
chrg(n){this.ch=Math.min(this.ch+n,this.mxC)}
cdTk(){for(let k in this.cd)if(this.cd[k]>0)this.cd[k]--}
gCd(k){return this.cd[k]||0}
sCd(k,v){this.cd[k]=v}
inRg(tx,ty){let dx=tx-this.x,dy=ty-this.y;return this.rg.some(r=>dx===r[0]&&dy===r[1])}
alive(){return this.al||this.delay>0}
}

// ===== 主场景 =====
class BS extends Phaser.Scene{
constructor(){super('BS')}
create(){
this.cameras.main.setBackgroundColor('#111');
this.us=[];this.sel=null;this.cT='p1';this.rn=1;this.go=0;this.lgs=[];
this.gG=this.add.graphics();this.dG();
this.infoT=this.add.text(OX,4,'',{fontSize:'10px',color:'#ccc',wordWrap:{width:440}});
this.logT=this.add.text(OX,OY+H*SZ+4,'',{fontSize:'8px',color:'#777',wordWrap:{width:440}});
this.cB();this.input.on('pointerdown',p=>this.oC(p));
this.roster=mkRoster();
this.pickPhase();
}

dG(){
let g=this.gG;g.clear();
for(let x=0;x<W;x++)for(let y=0;y<H;y++){
let px=OX+x*SZ,py=OY+y*SZ;
g.fillStyle(x==3?0x222244:0x1a1a33,1);g.fillRect(px+1,py+1,SZ-2,SZ-2);
g.lineStyle(1,0x333355,0.5);g.strokeRect(px,py,SZ,SZ);
}
}

pickPhase(){
// 随机分配8个角色 4v4
let pool=[...this.roster].sort(()=>Math.random()-0.5);
let sel=pool.slice(0,8);
sel.slice(0,4).forEach((r,i)=>{
let c={...r,t:'p1',x:1+i,y:2,m:r.m||5};
c.sk=r.sk.map(s=>({...s}));c.pv=r.pv||[];
this.us.push(new U(c));
});
sel.slice(4,8).forEach((r,i)=>{
let c={...r,t:'p2',x:6-i,y:2,m:r.m||5};
c.sk=r.sk.map(s=>({...s}));c.pv=r.pv||[];
this.us.push(new U(c));
});
// 羁绊效果
let chs=this.us.find(u=>u.n=='陈色'&&u.tm=='p1');
let dwc=this.us.find(u=>u.n=='第五陈色'&&u.tm=='p1');
if(chs&&dwc){dwc.atk+=1;this.lg('羁绊:第五陈色攻击力+1');}
let zs=this.us.find(u=>u.n=='周水');
let jzls=this.us.find(u=>u.n=='加州老鼠');
if(zs&&jzls&&zs.tm==jzls.tm){jzls.rage+=4;zs.mH+=1;zs.hp+=1;this.lg('羁绊:加州老鼠怒气上限+4 周水+1HP');}
let ly=this.us.find(u=>u.n=='路易十六');
let xl=this.us.find(u=>u.n=='小六');
if(ly&&xl&&ly.tm==xl.tm){xl.agi+=3;this.lg('羁绊:小六敏捷+3');}

// 初始化被动
this.us.forEach(u=>{
if(u.n=='周水')u.sth=1;
if(u.n=='手充')u.sth=999;
if(u.n=='蓝主任'){u.gru=1;}
if(u.n=='加州老鼠'){u.rage=u.rage||4;}
if(u.n=='丁衍征一'){u.form=0;}
if(u.cls=='冲锋手'){u.fd=0;}
if(u.n=='优南'){u.qi=0;}
if(u.n=='科比牢大'){u.bonus=0;}
(u.sk||[]).forEach(s=>{if(s.cd)u.cd[s.n]=0;});
});

this.us.forEach(u=>this.mkSp(u));
this.upAll();
// 先手判定
let p1a=this.us.filter(u=>u.tm=='p1').reduce((s,u)=>s+u.agi,0);
let p2a=this.us.filter(u=>u.tm=='p2').reduce((s,u)=>s+u.agi,0);
if(p1a!=p2a)this.cT=p1a>p2a?'p1':'p2';
else{let p1h=this.us.filter(u=>u.tm=='p1').reduce((s,u)=>s+u.mH,0);let p2h=this.us.filter(u=>u.tm=='p2').reduce((s,u)=>s+u.mH,0);this.cT=p1h<p2h?'p1':'p2'}
this.lg('先手:'+(this.cT=='p1'?'蓝方':'红方'));
this.sR();
}

sR(){
this.us.forEach(u=>{if(u.al)u.chrg(1)});
// 流血
this.us.forEach(u=>{if(u.al&&u.bl>0){u.dmg(2,1);this.lg(u.n+' 流血-2');u.bl--}});
// 王土大招回复
if(this.us.some(v=>v.n=='王土'&&v.ult))this.us.filter(v=>v.tm=='p1'&&v.al).forEach(v=>v.heal(1));
// 大树回复
this.us.filter(v=>v.al&&v.isS&&v.isTree).forEach(v=>{this.us.filter(w=>w.al&&w.tm==v.tm&&Math.abs(w.x-v.x)<=1&&Math.abs(w.y-v.y)<=1).forEach(w=>w.heal(2))});
// 雪豹伤害
this.us.filter(v=>v.al&&v.isS&&v.type=='xb').forEach(v=>{this.us.filter(w=>w.al&&w.tm!=v.tm&&Math.abs(w.x-v.x)<=1&&Math.abs(w.y-v.y)<=1).forEach(w=>{w.dmg(4);this.lg('雪豹→'+w.n+' 4伤')})});
// 老鼠冲锋
this.us.filter(v=>v.al&&v.isS&&v.rush).forEach(v=>{let t=this.us.find(w=>w.tm!=v.tm&&w.al&&w.x==v.x);if(t){t.dmg(1);this.lg('老鼠冲锋→'+t.n+' 1伤')}v.al=0});
this.us=this.us.filter(v=>v.al);
// 清理召唤物精灵
this.clSp();
// 手充HP上限-1
this.us.filter(v=>v.n=='手充'&&v.al).forEach(v=>{v.mH-=1;if(v.mH<1)v.mH=1;if(v.hp>v.mH)v.hp=v.mH});
// 科比攻击力累加
this.us.filter(v=>v.n=='科比牢大'&&v.al&&v.bonus<8).forEach(v=>v.bonus++);
// 蓝主任积怨
this.us.filter(v=>v.n=='蓝主任'&&v.al).forEach(v=>{v.gTur++;if(v.gTur>=5){v.gTur=0;v.gru++;}});
// 减状态
this.us.forEach(u=>{u.sth=Math.max(0,u.sth-0);u.tt=0;u.bd=Math.max(0,u.bd-0);u.inv=0;});
// CD
this.us.forEach(u=>{u.cdTk()});
// 肖牢大隐匿
this.us.filter(v=>v.n=='肖牢大'&&v.al&&v.dT>0).forEach(v=>v.sth=1);
this.us.forEach(v=>v.dT=0);

this.us.forEach(u=>u.ac=0);
this.ao=this.us.filter(u=>u.al&&u.tm==this.cT).sort((a,b)=>b.agi-a.agi);
this.tI=0;this.upI();this.sMT();
}

sMT(){
if(this.tI>=this.ao.length){this.sT();return}
let u=this.ao[this.tI];
if(!u.al||u.st>0){if(u.st>0){this.lg(u.n+' 眩晕跳过');u.st--}this.eMT(u);return}
// 延迟死亡
if(u.delay){u.delay=0;u.al=0;this.lg(u.n+' 延迟死亡触发!');this.eMT(u);return}
// 自动大招
let au=u.sk&&u.sk.find(s=>s.tp=='ult'&&s.auto&&u.ch>=s.ch);
if(au){au.ex(u,this);this.upAll();this.eMT(u);return}
this.sel=u;this.cH();this.hC(u.x,u.y,0xff0);this.hT(u);this.upI()
}

eMT(u){
this.sel=null;this.cH();
let ex=this.extraTurn||[];if(ex.length>0){let eu=ex.shift();this.ao.unshift(eu);this.lg(eu.n+' 额外行动!')}
this.upAll();
if(!this.go)this.cGO();
if(!this.go){this.tI++;if(this.tI>=this.ao.length)this.sT();else this.sMT()}
}

sT(){
if(!this.us.some(u=>u.tm=='p1'&&u.al&&!u.isS)||!this.us.some(u=>u.tm=='p2'&&u.al&&!u.isS)){this.cGO();return}
this.cT=this.cT=='p1'?'p2':'p1';
if(this.cT=='p1'){this.rn++;this.lg('── 第'+this.rn+'回合 ──')}
this.sR()
}

oC(p){
if(this.go){this.scene.restart();return}
let gx=Math.floor((p.x-OX)/SZ),gy=Math.floor((p.y-OY)/SZ);
if(gx<0||gx>=W||gy<0||gy>=H)return;
let u=this.gU(gx,gy);

if(this.sel&&u&&u.tm!=this.sel.tm&&u.al){
this.exA(this.sel,u)
}else if(u&&u.tm==this.cT&&u.al&&u.st==0&&!u.isS){
this.sel=u;this.cH();this.hC(gx,gy,0xff0);this.hT(u);this.upI()
}
}

exA(a,d){
// 选择技能: 大招>技能>普攻
let hasU=a.sk&&a.sk.some(s=>s.tp=='ult'&&!s.auto&&a.ch>=s.ch);
let hasS=a.sk&&a.sk.some(s=>s.tp=='sk'&&a.gCd(s.n)<=0&&(!s.ch||a.ch>=s.ch));
let hasB=a.sk&&a.sk.some(s=>s.tp=='ba');

if(hasU){
let ult=a.sk.find(s=>s.tp=='ult'&&!s.auto&&a.ch>=s.ch);
if(ult)ult.ex(a,this);
}else if(hasS&&!a.selFirst){
let sk=a.sk.find(s=>s.tp=='sk'&&a.gCd(s.n)<=0&&(!s.ch||a.ch>=s.ch));
if(sk)sk.ex(a,this);
}else if(hasB){
let ba=a.sk.find(s=>s.tp=='ba');
let al=a.sk.filter(s=>s.tp=='ba');
if(al.length>1){
// 多普攻角色选第一个
ba=al[0];
}
if(ba)ba.ex(a,d,this);
if(a.ult&&a.n=='手充'){
this.us.filter(v=>v.tm!=a.tm&&v.al&&Math.abs(v.x-d.x)<=1&&Math.abs(v.y-d.y)<=1&&v!=d).forEach(v=>{v.dmg(a.atk);this.lg('溅射→'+v.n)});
if(a.ult>0)a.ult--;if(a.ult<=0)this.lg('大招溅射结束')
}
}else{
this.lg(a.n+' 无法攻击')
}

// 充能
this.us.forEach(u=>{if(u.al&&u.tm!=a.tm&&u==d)u.chrg(1)});

this.cH();this.sel=null;this.upAll();this.upI();
if(!this.go)this.cGO();
if(!this.go)this.eMT(a)
}

tAil(u,type){
this.lg('【'+{neuro:'神经',fear:'恐惧',burn:'燃烧'}[type]+'损伤触发】'+u.n);
if(type=='neuro'){u.dmg(2,1);u.st+=1}
else if(type=='fear'){u.dmg(4,1)}
else if(type=='burn'){u.dmg(2,1);u.bl+=3}
}

mkSp(u){
let px=OX+u.x*SZ+SZ/2,py=OY+u.y*SZ+SZ/2-8;
let c=u.tm=='p1'?0x4488ff:0xff4444;
u.bS=this.add.circle(px,py+10,15,c,0.3);
u.sp=this.add.circle(px,py,13,c,0.85);
u.nS=this.add.text(px,py-18,u.n.substring(0,3),{fontSize:'8px',color:'#fff'}).setOrigin(0.5);
u.hB=this.add.rectangle(px,py+25,34,4,0x333);
u.hF=this.add.rectangle(px-17,py+25,34,4,0x4f4).setOrigin(0,0.5);
u.hT=this.add.text(px,py+31,`${u.hp}`,{fontSize:'7px',color:'#aaa'}).setOrigin(0.5);
u.cT=this.add.text(px+14,py-8,'',{fontSize:'7px',color:'#fc0'}).setOrigin(0.5);
u.sT=this.add.text(px-14,py-8,'',{fontSize:'7px',color:'#8cf'}).setOrigin(0.5);
if(u.isS){u.sp.setFillStyle(u.isTree?0x44aa44:(u.type=='xb'?0xcccccc:0x88aa88));u.sp.setRadius(8)}
}

reSp(u){
if(!u.sp)return;
let px=OX+u.x*SZ+SZ/2,py=OY+u.y*SZ+SZ/2-8;
u.sp.setPosition(px,py);u.bS.setPosition(px,py+10);u.nS.setPosition(px,py-18);
u.hB.setPosition(px,py+25);u.hF.setPosition(px-17,py+25);u.hT.setPosition(px,py+31);
u.cT.setPosition(px+14,py-8);u.sT.setPosition(px-14,py-8);
}

upSp(u){
if(!u.al||u.delay){if(u.sp){u.sp.setAlpha(0.1);u.nS.setAlpha(0.1);u.bS.setAlpha(0.05);u.hT.setText('');u.cT.setText('');u.sT.setText('')}return}
let r=u.hp/u.mH;
u.hF.setDisplaySize(34*r,4);
u.hF.setFillStyle(r>0.5?0x44ff44:(r>0.25?0xffaa00:0xff4444));
u.hT.setText(`${u.hp}/${u.mH}`);

u.sT.setText(u.sh>0?`🛡${u.sh}`:'');
let a=u.st>0?0.5:(u.sth>0?0.4:(u.inv?0.6:0.85));
if(u.sp)u.sp.setAlpha(a);
}

upAll(){this.us.forEach(u=>this.upSp(u))}
clSp(){this.us.filter(v=>!v.al).forEach(v=>{if(v.sp)v.sp.setVisible(false)})}

cB(){
[{t:'跳过',x:OX,fn:()=>{if(this.sel)this.eMT(this.sel)}},
{t:'大招',x:OX+80,fn:()=>{if(!this.sel)return;let u=this.sel;let ult=u.sk&&u.sk.find(s=>s.tp=='ult'&&!s.auto&&u.ch>=s.ch);if(ult){ult.ex(u,this);this.eMT(u)}}},
{t:'技能',x:OX+160,fn:()=>{
if(!this.sel)return;let u=this.sel;
let sks=u.sk&&u.sk.filter(s=>s.tp=='sk'&&u.gCd(s.n)<=0&&(!s.ch||u.ch>=s.ch));

}},
].forEach(b=>{

btn.on('pointerdown',b.fn);

})
}

hC(x,y,c){let g=this.gG,px=OX+x*SZ,py=OY+y*SZ;g.lineStyle(3,c,1);g.strokeRect(px+2,py+2,SZ-4,SZ-4)}
hT(u){this.us.filter(v=>v.tm!=u.tm&&v.al).forEach(e=>{if(u.inRg(e.x,e.y))this.hC(e.x,e.y,0xf66)})}
cH(){this.dG()}
gU(x,y){return this.us.find(u=>u.al&&u.x==x&&u.y==y)}
fE(x1,x2,y1,y2){for(let x=Math.max(0,x1);x<=Math.min(W-1,x2);x++)for(let y=Math.max(0,y1);y<=Math.min(H-1,y2);y++){if(!this.gU(x,y)&&x!=3)return{x:x,y:y}}return null}

upI(){
let t=this.cT=='p1'?'蓝方':'红方';
let i='第'+this.rn+'回合 | '+t+'行动';
if(this.sel)i+='\n'+this.sel.n+' HP:'+this.sel.hp+'/'+this.sel.mH+' ATK:'+this.sel.atk+' 充:'+this.sel.ch+'/'+this.sel.mxC+(this.sel.qi?' 气:'+this.sel.qi:(this.sel.gru?' 怨:'+this.sel.gru:(this.sel.rage?' 怒:'+this.sel.rage:'')));
this.infoT.setText(i);this.logT.setText(this.lgs.slice(-4).join('\n'))
}
lg(m){this.lgs.push(m)}
cGO(){

let p2=this.us.some(u=>u.tm=='p2'&&u.al&&!u.isS);

this.add.text(OX+60,OY+60,(p1?'蓝方':'红方')+'获胜!',{fontSize:'26px',color:'#fc0',fontStyle:'bold'});
this.add.text(OX+50,OY+110,'点击重新开始',{fontSize:'11px',color:'#999'});
}
}
cleanSp(){this.us.filter(v=>!v.al&&v.sp).forEach(v=>v.sp.setVisible(false))}
}
