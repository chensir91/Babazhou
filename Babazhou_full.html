<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>八宝舟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:sans-serif}
#app{width:100%;max-width:480px;color:#ddd;padding:8px}
.phase{display:none}
.phase.active{display:block}
h2{text-align:center;margin:8px 0;font-size:16px;color:#fc0}
.info{text-align:center;font-size:12px;color:#aaa;margin:4px 0}
.grid{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;padding:8px}
.chip{padding:6px 10px;border-radius:6px;font-size:12px;cursor:pointer;border:2px solid #444;background:#1a1a33;color:#ccc;text-align:center;min-width:64px}
.chip.banned{background:#331111;color:#663;text-decoration:line-through;pointer-events:none}
.chip.picked{background:#113311;border-color:#3a3;cursor:default}
.chip.enemy{background:#331111;border-color:#a33;cursor:default}
.chip.selected{border-color:#fc0!important;background:#332200}
.chip.dir{background:#2a2a44}
.chip.dir.active{border-color:#4488ff!important;background:#223355}
.btn{padding:10px 20px;border-radius:8px;border:none;background:#336;color:#fff;font-size:14px;cursor:pointer;margin:4px}
.btn:active{background:#558}
.btn.dis{opacity:0.4;pointer-events:none}
#board{position:relative;width:420px;height:300px;margin:0 auto;background:#1a1a2e;border-radius:4px}
.slot{position:absolute;width:56px;height:56px;border:1px solid #333355;background:#222244;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px}
.slot.mid{background:#1a1a33;border-color:#2a2a55}
.slot.p1{background:#223355}
.slot.p2{background:#332222}
.slot.unit{background:#224;border-color:#4488ff88}
.slot.sel{border-color:#fc0!important;box-shadow:0 0 8px #fc0}
.slot.tgt{border-color:#f66!important;box-shadow:0 0 6px #f66}
.slot .n{font-size:9px;font-weight:bold}
.slot .hp{font-size:8px;color:#4f4}
.slot .cd{font-size:7px;color:#fc0}
.logs{max-height:80px;overflow-y:auto;font-size:9px;color:#777;margin-top:4px;padding:4px;background:#111;border-radius:4px}
.row{display:flex;gap:6px;justify-content:center;margin:6px 0;flex-wrap:wrap}
.pool-grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
</style></head>
<body>
<div id="app">

<div id="ban" class="phase active">
<h2>🔵 蓝方 BAN（1/2）</h2>
<div class="info">点击角色禁用（共BAN 4个）</div>
<div id="banPool" class="grid"></div>
</div>

<div id="pick" class="phase">
<h2 id="pickTitle"></h2>
<div class="info" id="pickInfo"></div>
<div id="pickPool" class="grid"></div>
<div class="row"><button class="btn" onclick="confirmPick()">确认选择</button></div>
</div>

<div id="deploy" class="phase">
<h2 id="deployTitle">布阵 - 蓝方</h2>
<div class="info">点击角色→点击己方空格放置</div>
<div id="board"></div>
<div class="row" id="deployRoster"></div>
<div class="row"><button class="btn" id="deployOk" onclick="confirmDeploy()">确认布阵</button></div>
</div>

<div id="battle" class="phase">
<div id="battleInfo" style="text-align:center;font-size:11px;margin:2px 0"></div>
<div id="board2"></div>
<div class="row">
<button class="btn" onclick="bSkip()">跳过</button>
<button class="btn" onclick="bUlt()">大招</button>
<button class="btn" onclick="bSkill()">技能</button>
</div>
<div class="logs" id="logs"></div>
</div>

<div id="gameover" class="phase">
<h2 id="winnerText"></h2>
<div class="row"><button class="btn" onclick="location.reload()">重新开始</button></div>
</div>

</div>

<script>
// ===== 24角色数据 =====

{tp:'ult',n:'虫群',ch:3,ex:(u,b)=>{let ws=b.us.filter(v=>v.isS&&v.mst===u);let th=ws.reduce((s,w)=>s+w.hp,0);let es=b.us.filter(v=>v.tm!=u.tm&&v.al);if(es.length){es.forEach(e=>e.dmg(Math.floor(th/es.length*2)));b.lg('虫群:每人'+Math.floor(th/es.length*2)+'伤害')}b.us.filter(v=>v.tm==u.tm).forEach(v=>v.atk+=1);ws.forEach(w=>w.al=0);u.ch=0}}

// ===== 损伤/单位 =====
class Ail{constructor(t){this.t=t;this.s=0}add(n){this.s+=n;if(this.s>=10){this.s=0;return 1}return 0}}
function mu(n,h,a,g,t,x,y,m,r,isS,mst,isTree){
return{n:n,hp:h,mH:h,atk:a,agi:g,tm:t,x:x,y:y,mxc:m||5,rg:r||[[0,0]],ch:0,sh:0,al:1,
st:0,bd:0,bl:0,sth:0,tt:0,inv:0,
ail:{neuro:new Ail('neuro'),fear:new Ail('fear'),burn:new Ail('burn')},
cd:{},sto:{},sk:[],cs:0,isS:isS||0,mst:mst||null,isTree:isTree||0,
qi:0,ultA:0,fd:0,intel:0,gru:0,rage:0,form:0,xiaoy:0,chging:0,chgSk:null,
lt:null,tkS:0,idS:0,bns:0,elec:'',imd:0}
}
// 扩展Unit方法
function dmg(u,v,p){if(!u.al)return 0;let a=v;if(!p&&u.sh>0){let b=u.sh;u.sh=Math.max(0,u.sh-a);a=Math.max(0,a-b)}u.hp-=a;if(u.hp<=0){u.hp=0;u.al=0}return a}
function heal(u,v){if(u.al)u.hp=Math.min(u.mH,u.hp+v)}
function chg(u,n){u.ch=Math.min(u.ch+n,u.mxc)}
function sCd(u,k,v){u.cd[k]=v}
function gCd(u,k){return u.cd[k]||0}
function cdTk(u){for(let k in u.cd)if(u.cd[k]>0)u.cd[k]--}
function inRg(u,tx,ty){let dx=tx-u.x,dy=ty-u.y;return u.rg.some(r=>dx===r[0]&&dy===r[1])}

// 给所有Unit添加方法
function bindU(u){
u.dmg=function(v,p){return dmg(this,v,p)};u.heal=function(v){return heal(this,v)};
u.chg=function(n){return chg(this,n)};u.sC=function(k,v){return sCd(this,k,v)};
u.gCd=function(k){return gCd(this,k)};u.cdTk=function(){return cdTk(this)};
u.inRg=function(tx,ty){return inRg(this,tx,ty)};
u.sk=ROSTER.find(r=>r.n==u.n)?.sk||[];
}

let pool=[],p1pick=[],p2pick=[],bans=[];
let banTurn=0,banOrder=['蓝','红','红','蓝'];
let pickTurn=0,pickOrder=['蓝','红','红','蓝','蓝','红','红','蓝','蓝','红'];
let deployTurn='蓝',deployCur=null,deployPos=[[0,1],[1,1],[2,1],[0,2],[1,3],[4,1],[5,1],[6,1],[4,2],[5,3]];
let p1deploy=[],p2deploy=[];

// ===== 战斗引擎 =====
let bus=[],bsel=null,bct='p1',brn=1,blogs=[],bgo=0,bao=[],bti=0,bextra=null;

// ===== UI =====
function setPhase(p){
document.querySelectorAll('.phase').forEach(e=>e.classList.remove('active'));
document.getElementById(p).classList.add('active');
}
function $(id){return document.getElementById(id)}

// ===== BAN阶段 =====
function startBan(){
pool=ROSTER.map(r=>({...r}));
bans=[];banTurn=0;
setPhase('ban');renderBan();
}
function renderBan(){
let h=$('ban').querySelector('h2');
let bteam=banOrder[banTurn];h.textContent=(bteam=='蓝'?'🔵':'🔴')+' '+bteam+'方 BAN ('+(banTurn+1)+'/4)';
let d=$('banPool');d.innerHTML='';
pool.forEach((r,i)=>{
let ch=document.createElement('div');ch.className='chip'+(bans.includes(i)?' banned':'');
ch.textContent=r.n+' ['+r.cls+']';

});
}

// ===== PICK阶段 =====
function startPick(){
p1pick=[];p2pick=[];pickTurn=0;
setPhase('pick');renderPick();
}
function renderPick(){
let pt=pickOrder[pickTurn];
$('pickTitle').textContent=(pt=='蓝'?'🔵':'🔴')+' '+pt+'方选人 ('+(pickTurn+1)+'/10)';
let d=$('pickPool');d.innerHTML='';
pool.forEach((r,i)=>{
if(bans.includes(i))return;
let picked=p1pick.includes(i)||p2pick.includes(i);
let ch=document.createElement('div');ch.className='chip'+(picked?' picked':'');
ch.textContent=r.n+' ['+r.cls+'] HP:'+r.h+' ATK:'+r.a+' AGI:'+r.g;
if(!picked){ch.onclick=()=>{
ch.classList.toggle('selected');
if(pt=='蓝'){
let idx=p1pick.indexOf(i);if(idx>=0)p1pick.splice(idx,1);else p1pick.push(i);
}else{
let idx=p2pick.indexOf(i);if(idx>=0)p2pick.splice(idx,1);else p2pick.push(i);
}
}}
d.appendChild(ch);
});
$('pickInfo').textContent='点击选择1个角色';
}
function confirmPick(){
let pt=pickOrder[pickTurn];
let picks=pt=='蓝'?p1pick:p2pick;
if(picks.length!==pickTurn/2+1){alert('请选1个角色');return}
pickTurn++;
if(pickTurn<10){renderPick()}else{startDeploy()}
}

// ===== 布阵阶段 =====
function startDeploy(){
deployTurn='蓝';deployCur=null;
p1deploy=[];p2deploy=[];
setPhase('deploy');renderDeploy();
}
function renderDeploy(){
$('deployTitle').textContent=(deployTurn=='蓝'?'🔵 蓝方':'🔴 红方')+' 布阵';
let brd=$('board');brd.innerHTML='';
// 7x5格子
for(let x=0;x<7;x++)for(let y=1;y<6;y++){
let slot=document.createElement('div');slot.className='slot';
let isMid=x==3,isP1=x<3,isP2=x>3;
if(isMid)slot.classList.add('mid');
else if(isP1)slot.classList.add('p1');
else slot.classList.add('p2');
slot.style.left=(x*56+10)+'px';slot.style.top=((y-1)*56+10)+'px';
slot.dataset.x=x;slot.dataset.y=y;
// 已部署的单位
let dep=[...p1deploy,...p2deploy].find(d=>d.x==x&&d.y==y);
if(dep){slot.innerHTML='<span class="n">'+dep.n+'</span>';slot.classList.add('unit')}
if(!dep&&!isMid){
let valid=deployTurn=='蓝'?isP1:isP2;
if(valid)slot.onclick=()=>{
if(!deployCur)return;
let exist=[...p1deploy,...p2deploy].find(d=>d.x==x&&d.y==y);
if(exist)return;
deployCur.x=x;deployCur.y=y;
if(deployTurn=='蓝'&&!p1deploy.find(d=>d===deployCur))p1deploy.push(deployCur);
if(deployTurn=='红'&&!p2deploy.find(d=>d===deployCur))p2deploy.push(deployCur);
let allDep=deployTurn=='蓝'?p1deploy:p2deploy;
if(allDep.length>=5){if(deployTurn=='蓝'){deployTurn='红';deployCur=null;renderDeploy()}else{confirmDeploy()}}
else renderDeploy();
}
}
brd.appendChild(slot);
}
// 可选角色
let dr=$('deployRoster');dr.innerHTML='';
let picks=deployTurn=='蓝'?p1pick:p2pick;
picks.forEach((pi,i)=>{
let r=pool[pi];
let dep=deployTurn=='蓝'?p1deploy:p2deploy;
let used=dep.some(d=>d._pi===pi);
if(!used){
let ch=document.createElement('div');
ch.className='chip'+(deployCur&&deployCur._pi===pi?' selected':'');
ch.textContent=r.n+' ['+r.cls+']';
ch.onclick=()=>{
if(deployCur&&deployCur._pi===pi){deployCur=null;renderDeploy();return}
deployCur={n:r.n,...r,_pi:pi,sk:r.sk||[],x:-1,y:-1};
let arr=deployTurn=='蓝'?p1deploy:p2deploy;
let idx=arr.findIndex(d=>d._pi===pi);
if(idx>=0)arr.splice(idx,1);
renderDeploy();
};
dr.appendChild(ch);
}
});
}
function confirmDeploy(){
if(p1deploy.length<5||p2deploy.length<5)return;
startBattle();
}

// ===== 战斗阶段 =====
function startBattle(){
bus=[];
let allDeploy=[...p1deploy.map(d=>({...d,tm:'p1'})),...p2deploy.map(d=>({...d,tm:'p2'}))];
allDeploy.forEach(d=>{
let u=mu(d.n,d.h,d.a,d.g,d.tm,d.x,d.y,d.m||5,d.rg||[[0,0]]);
u.sk=d.sk||[];
bindU(u);
// 羁绊
if(u.n=='第五陈色'&&allDeploy.some(v=>v.n=='陈色'&&v.tm==u.tm))u.atk+=1;
if(u.n=='加州老鼠')u.rage=4;
if(u.n=='周水'){u.sth=1;if(allDeploy.some(v=>v.n=='加州老鼠'&&v.tm==u.tm)){u.mH+=1;u.hp+=1}}
if(u.n=='蓝主任'){u.gru=1;u.gTur=0}
if(u.n=='手充')u.sth=999;
if(u.n=='丁衍征一')u.form=0;
if(u.n=='科比牢大')u.bns=0;
bus.push(u);
});
bct='p1';brn=1;blogs=[];bgo=0;bsel=null;
setPhase('battle');renderBoard();
// 先手判定
let p1a=bus.filter(u=>u.tm=='p1').reduce((s,u)=>s+u.agi,0);
let p2a=bus.filter(u=>u.tm=='p2').reduce((s,u)=>s+u.agi,0);
if(p1a!=p2a)bct=p1a>p2a?'p1':'p2';
startRound();
}

function startRound(){
bus.filter(u=>u.al).forEach(u=>{u.chg(1);u.cdTk()});
bus.filter(u=>u.al&&u.bl>0).forEach(u=>{dmg(u,2,1);blogs.push(u.n+' 流血-2');u.bl--;if(u.al<=0)blogs.push(u.n+' 死亡')});
if(bus.some(v=>v.n=='王土'&&v.ultA))bus.filter(v=>v.tm=='p1'&&v.al).forEach(v=>heal(v,1));
bus.filter(v=>v.al&&v.isTree).forEach(v=>bus.filter(w=>w.al&&w.tm==v.tm&&Math.abs(w.x-v.x)<=1&&Math.abs(w.y-v.y)<=1).forEach(w=>heal(w,2)));
bus.filter(v=>v.al&&v.n=='手充').forEach(v=>{v.mH-=1;if(v.mH<1)v.mH=1;if(v.hp>v.mH)v.hp=v.mH});
bus.filter(v=>v.al&&v.n=='科比牢大'&&v.bns<8).forEach(v=>v.bns++);
bus.filter(v=>v.al&&v.n=='蓝主任').forEach(v=>{v.gTur++;if(v.gTur>=5){v.gTur=0;v.gru++;blogs.push('蓝主任积怨+1')}});
bus.forEach(u=>{u.sth=Math.max(0,u.sth-1);u.tt=0;u.bd=Math.max(0,u.bd-1)});
bti=0;bao=bus.filter(u=>u.al&&u.tm==bct).sort((a,b)=>b.agi-a.agi);
upInfo();sMT();
}

function sMT(){
if(bti>=bao.length){switchTeam();return}
let u=bao[bti];
if(!u.al||u.st>0){if(u.st>0){blogs.push(u.n+' 眩晕跳过');u.st--}eMT(u);return}
let au=u.sk.find(s=>s.tp=='ult'&&s.auto&&u.ch>=s.ch);
if(au){au.ex(u,{us:bus,lg:m=>blogs.push(m),fE,gU,sel:null});eMT(u);return}
bsel=u;renderBoard();upInfo();
}

function sMT(){if(bti>=bao.length){switchTeam();return}let u=bao[bti];if(!u.al||u.st>0){if(u.st>0){blogs.push(u.n+' 眩晕跳过');u.st--}eMT(u);return}let au=u.sk.find(s=>s.tp=='ult'&&s.auto&&u.ch>=s.ch);if(au){let ctx={us:bus,lg:m=>blogs.push(m),fE,gU,sel:null};au.ex(u,ctx);bsel=null;eMT(u);return}bsel=u;renderBoard();upInfo();}

function switchTeam(){
if(!bus.some(u=>u.tm=='p1'&&u.al)||!bus.some(u=>u.tm=='p2'&&u.al)){checkGO();return}
bct=bct=='p1'?'p2':'p1';
if(bct=='p1'){brn++;blogs.push('── 第'+brn+'回合 ──')}
if(bextra){let eu=bextra;bextra=null;blogs.push(eu.n+' 额外行动!');bus=bus;/*简化*/}
bsel=null;startRound();
}
function eMT(u){bsel=null;bti++;renderBoard();upInfo();if(!bgo)checkGO();if(!bgo){if(bti>=bao.length)switchTeam();else sMT()}}

function checkGO(){
let p1=bus.some(u=>u.tm=='p1'&&u.al);
let p2=bus.some(u=>u.tm=='p2'&&u.al);
if(!p1||!p2){bgo=1;setPhase('gameover');$('winnerText').textContent=(p1?'🔵 蓝方':'🔴 红方')+' 获胜!'}
}

function renderBoard(){
let brd=$('board2');brd.innerHTML='';
brd.style.width='420px';brd.style.height='300px';brd.style.position='relative';brd.style.background='#1a1a2e';brd.style.margin='0 auto';brd.style.borderRadius='4px';
bus.forEach(u=>{if(!u.al)return;
let slot=document.createElement('div');slot.className='slot';
if(u.x<3)slot.classList.add('p1');else if(u.x>3)slot.classList.add('p2');else slot.classList.add('mid');
if(bsel===u)slot.classList.add('sel');
slot.style.left=(u.x*56+10)+'px';slot.style.top=((u.y-1)*56+10)+'px';
slot.style.position='absolute';
let hpColor=u.hp/u.mH>0.5?'#4f4':(u.hp/u.mH>0.25?'#fa0':'#f44');
slot.innerHTML='<span class="n">'+u.n.substring(0,3)+'</span><span class="hp" style="color:'+hpColor+'">'+u.hp+'/'+u.mH+'</span>'+(u.ch>0?'<span class="cd">⚡'+u.ch+'</span>':'');
slot.onclick=()=>onBoardClick(u);
brd.appendChild(slot);
});
// 高亮可选目标
if(bsel){
bus.filter(u=>u.tm!=bsel.tm&&u.al&&bsel.inRg(u.x,u.y)).forEach(u=>{
let tgt=brd.querySelector('[style*="left:'+(u.x*56+10)+'px"][style*="top:'+((u.y-1)*56+10)+'px"]');
if(tgt)tgt.classList.add('tgt');
});
}
// 日志
$('logs').innerHTML=blogs.slice(-8).map(l=>'<div>'+l+'</div>').join('');
}

function onBoardClick(u){
if(!bsel)return;
if(u.tm==bsel.tm){bsel=u;renderBoard();return}
// 执行攻击
let ctx={us:bus,lg:m=>blogs.push(m),fE,gU,sel:u,extra:bextra};
exAtk(bsel,u,ctx);
bsel=null;bus=bus.filter(v=>v.al);
renderBoard();upInfo();
if(!bgo)checkGO();
if(!bgo)eMT(bsel||bao[bti]);
}

function exAtk(a,d,ctx){
let hasU=a.sk.some(s=>s.tp=='ult'&&!s.auto&&a.ch>=s.ch);
let hasS=a.sk.some(s=>s.tp=='sk'&&a.gCd(s.n)<=0&&(!s.ch||a.ch>=s.ch));
let hasB=a.sk.some(s=>s.tp=='ba');
if(hasU){a.sk.find(s=>s.tp=='ult'&&!s.auto&&a.ch>=s.ch).ex(a,ctx)}
else if(hasS){a.sk.find(s=>s.tp=='sk'&&a.gCd(s.n)<=0&&(!s.ch||a.ch>=s.ch)).ex(a,ctx)}
else if(hasB){a.sk.find(s=>s.tp=='ba').ex(a,d,ctx)}
else{ctx.lg(a.n+' 无法攻击')}
if(a.n=='手充'&&a.ultA>0){bus.filter(v=>v.tm!=a.tm&&v.al&&Math.abs(v.x-d.x)<=1&&Math.abs(v.y-d.y)<=1&&v!=d).forEach(v=>dmg(v,a.atk));a.ultA--}
bus.filter(u=>u.al&&u.tm!=a.tm&&u==d).forEach(u=>u.chg(1));
}

function bSkip(){if(bsel){eMT(bsel);renderBoard()}}
function bUlt(){if(!bsel)return;let u=bsel;let ult=u.sk.find(s=>s.tp=='ult'&&!s.auto&&u.ch>=s.ch);if(ult){ult.ex(u,{us:bus,lg:m=>blogs.push(m),fE,gU,sel:null});bsel=null;renderBoard()}}
function bSkill(){if(!bsel)return;let u=bsel;let sk=u.sk.find(s=>s.tp=='sk'&&u.gCd(s.n)<=0&&(!s.ch||u.ch>=s.ch));if(sk){sk.ex(u,{us:bus,lg:m=>blogs.push(m),fE,gU,sel:null});bsel=null;renderBoard()}}

function upInfo(){
let info='第'+brn+'回合 | '+(bct=='p1'?'🔵蓝':'🔴红')+'方';
if(bsel)info+=' | 已选:'+bsel.n+' HP:'+bsel.hp+'/'+bsel.mH+' ATK:'+bsel.atk+' 充:'+bsel.ch+'/'+bsel.mxc;
$('battleInfo').textContent=info;
}

function gU(x,y){return bus.find(u=>u.al&&u.x==x&&u.y==y)}
function fE(x1,x2,y1,y2){for(let x=Math.max(0,x1);x<=Math.min(6,x2);x++)for(let y=Math.max(1,y1);y<=Math.min(5,y2);y++){if(!gU(x,y)&&x!=3)return{x,y}}return null}

// 启动
startBan();
