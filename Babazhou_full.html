<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>八宝舟</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-family:sans-serif}
#app{width:100%;max-width:480px;color:#ddd;padding:5px}
.phase{display:none}
.phase.active{display:block}
h2{text-align:center;margin:4px 0;font-size:15px;color:#fc0}
.info{text-align:center;font-size:11px;color:#aaa;margin:2px 0}
.grid{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;padding:4px}
.chip{padding:5px 8px;border-radius:5px;font-size:11px;cursor:pointer;border:2px solid #444;background:#1a1a33;color:#ccc;text-align:center;min-width:60px}
.chip.banned{background:#331111;color:#664;text-decoration:line-through;pointer-events:none}
.chip.picked{background:#113311;border-color:#3a3;cursor:default}
.chip.enemy{background:#331111;border-color:#a33;cursor:default}
.chip.selected{border-color:#fc0!important;background:#332200}
.chip.dir{background:#2a2a44}
.chip.dir.active{border-color:#4488ff!important;background:#223355}
.btn{padding:8px 14px;border-radius:6px;border:none;background:#336;color:#fff;font-size:12px;cursor:pointer;margin:3px}
.btn:active{background:#558}
.btn.dis{opacity:0.4;pointer-events:none}
#board,#board2{position:relative;width:302px;height:220px;margin:0 auto;background:linear-gradient(90deg,rgba(30,40,80,0.4) 0%,rgba(30,40,80,0.4) 40%,transparent 40%,transparent 60%,rgba(80,25,25,0.4) 60%,rgba(80,25,25,0.4) 100%),#151525;border-radius:4px;box-shadow:0 3px 16px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.02);border:1px solid #2a2a44}
.main-grid{display:flex;gap:2px;align-items:flex-start;justify-content:center;margin-top:2px}
.main-grid #board,.main-grid #board2{width:302px;height:220px}
.main-grid .slot{width:42px;height:42px;font-size:8px}
.side-col{width:42px;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.side-cell{width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:#1a1a2e;border:1px solid #2a2a44;border-radius:3px;font-size:9px;color:#ccc;text-align:center;flex-direction:column;box-sizing:border-box}
.side-cell.p1{background:linear-gradient(180deg,#1a2e50,#162540);border-color:#2a4477}
.side-cell.p2{background:linear-gradient(180deg,#3a1a1a,#2a1515);border-color:#552a2a}
.side-cell.picked{background:#1a2e2e;border-color:#3a6}
.side-cell.dead{background:#1a1a1a;border-color:#444;color:#a33;font-size:7px}
.side-cell.current{border-color:#fc0!important;background:#332200;cursor:pointer}

.slot{position:absolute;width:42px;height:42px;border:1px solid #222;background:#111;border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:9px;box-shadow:inset 0 1px 4px rgba(0,0,0,0.5)}
.slot.mid{background:linear-gradient(180deg,#0c0c1a,#121225);border-color:#1a1a33;border-left-width:2px;border-right-width:2px}
.slot.p1{background:linear-gradient(180deg,#1a2e50,#162540);border-color:#2a4477;box-shadow:inset 0 0 8px rgba(50,100,200,0.08),inset 0 1px 4px rgba(0,0,0,0.3)}
.slot.p2{background:linear-gradient(180deg,#3a1a1a,#2a1515);border-color:#552a2a;box-shadow:inset 0 0 8px rgba(200,50,50,0.06),inset 0 1px 4px rgba(0,0,0,0.3)}
.slot.unit{background:linear-gradient(180deg,#1e1e40,#181835);border-color:#4488ff88;box-shadow:0 2px 8px rgba(0,0,0,0.5)}
.slot.sel{border-color:#fc0!important;box-shadow:0 0 14px #fc0,0 2px 8px rgba(0,0,0,0.5)}
.slot.tgt{border-color:#f66!important;box-shadow:0 0 10px #f66,0 2px 6px rgba(0,0,0,0.4)}
.slot.ready{border-color:#fc0!important;box-shadow:0 0 10px #fc0,0 2px 6px rgba(0,0,0,0.4);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 6px #fc0,0 2px 6px rgba(0,0,0,0.4)}50%{box-shadow:0 0 14px #fa0,0 2px 6px rgba(0,0,0,0.4)}}
@keyframes shake{0%,100%{transform:translateX(0)}10%{transform:translateX(var(--sx,-3px))}30%{transform:translateX(calc(var(--sx,-3px)*-1))}50%{transform:translateX(var(--sx,-3px))}70%{transform:translateX(calc(var(--sx,-3px)*-1))}90%{transform:translateX(var(--sx,-3px))}}
.slot.shake{animation:shake .35s ease}
@keyframes dmgFloat{0%{opacity:1;transform:translate(-50%,0)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-28px)}}
.dmg-popup{position:absolute;color:#f44;font-weight:bold;font-size:13px;z-index:10;pointer-events:none;left:50%;top:6px;transform:translateX(-50%);animation:dmgFloat 1s ease-out forwards;text-shadow:0 0 4px rgba(255,0,0,0.5)}
.slot .n{font-size:8px;font-weight:bold}
.slot .hp{font-size:7px;color:#4f4}
.slot .cd{font-size:7px;color:#fc0}
.skill-panel{display:none}
#skillBar{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin:4px 0;padding:4px}
#skillBar .sk-item{padding:5px 8px;border-radius:5px;cursor:pointer;background:#223;border:1px solid #335;color:#ccf;font-size:11px}
#skillBar .sk-item:hover{background:#334;border-color:#558}
#skillBar .sk-item.dim{opacity:0.4;pointer-events:none}
#skillBar .sk-item.atk{border-color:#f66;color:#faa}
#skillBar .sk-item.sk{border-color:#66f;color:#aaf}
#skillBar .sk-item.ult{border-color:#fc0;color:#ffa}
#skillBar .sk-title{text-align:center;color:#aaa;font-size:10px;margin-bottom:2px;width:100%}
.logs{max-height:60px;overflow-y:auto;font-size:8px;color:#777;margin-top:3px;padding:3px;background:#111;border-radius:4px;line-height:1.3}
.row{display:flex;gap:4px;justify-content:center;margin:4px 0;flex-wrap:wrap}
.skmode-hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:#fc0;padding:4px 10px;border-radius:4px;font-size:11px;z-index:20;pointer-events:none}

.grid6{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-width:288px;margin:0 auto;padding:4px}
.gcell{aspect-ratio:1;border-radius:4px;border:1px solid #444;background:#1a1a33;display:flex;flex-items:center;justify-content:center;font-size:9px;cursor:pointer;color:#ccc;text-align:center;position:relative;padding:2px;flex-direction:column;line-height:1.1}
.gcell:hover{background:#2a2a44}
.grid6-wrap{flex:1;max-width:288px}

.log-icon{position:fixed;bottom:8px;right:8px;width:36px;height:36px;border-radius:50%;background:#336;color:#fff;font-size:18px;border:none;cursor:pointer;z-index:50;display:flex;align-items:center;justify-content:center;line-height:1}
.log-modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:100;overflow-y:auto;padding:16px}
.log-modal.show{display:block}
.log-close{position:fixed;top:8px;right:16px;font-size:24px;color:#fff;cursor:pointer;z-index:101;background:none;border:none}
.log-content{color:#ccc;font-size:13px;line-height:1.8;max-width:600px;margin:0 auto;padding-top:20px}
.log-content .hdr{color:#fc0;font-weight:bold;margin:8px 0 2px;font-size:14px}
.log-content .side-hdr{color:#88f;font-weight:bold;margin:4px 0 2px;font-size:13px}
.log-content .act{color:#aaa;padding-left:12px}
.log-content .info{color:#888;padding-left:12px}
.cl-btn{position:fixed;left:6px;bottom:6px;width:28px;height:28px;border-radius:50%;background:#2a2a44;border:1px solid #555;color:#888;font-size:14px;cursor:pointer;z-index:200;display:flex;align-items:center;justify-content:center}
.cl-btn:active{background:#444}
.cl-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:300;flex-direction:column;align-items:center;justify-content:center}
.cl-modal.show{display:flex}
.cl-content{background:#1a1a2e;border:1px solid #555;border-radius:8px;padding:16px;max-width:380px;width:90%;max-height:70vh;overflow-y:auto;color:#aaa;font-size:13px;line-height:1.8}
.cl-content .cl-hdr{color:#fc0;font-size:15px;font-weight:bold;margin-bottom:8px;text-align:center}
.cl-close{position:absolute;top:10px;right:14px;color:#888;font-size:18px;cursor:pointer;background:none;border:none}
/* 隐匿三态特效 */
.slot.unit-sth{opacity:0.5;position:relative}
.slot.unit-sth::before{content:'';position:absolute;inset:-5px;border-radius:6px;background:radial-gradient(1px 1px at 15% 25%,rgba(255,255,255,0.7),transparent),radial-gradient(1px 1px at 55% 65%,rgba(255,255,255,0.5),transparent),radial-gradient(1.5px 1.5px at 75% 20%,rgba(255,255,255,0.6),transparent),radial-gradient(1px 1px at 35% 80%,rgba(255,255,255,0.4),transparent),radial-gradient(1px 1px at 85% 50%,rgba(255,255,255,0.55),transparent),radial-gradient(1.5px 1.5px at 65% 35%,rgba(255,255,255,0.6),transparent),radial-gradient(1px 1px at 25% 70%,rgba(255,255,255,0.45),transparent),radial-gradient(1px 1px at 45% 15%,rgba(255,255,255,0.5),transparent);animation:mistDrift 2.5s ease-in-out infinite;pointer-events:none;z-index:2}
.slot.unit-sth.sel{border-color:#fc0!important}
@keyframes mistDrift{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.03)}}
/* 获得隐匿：白雾从脚下升腾 */
.sth-gain-wrap{position:absolute;left:0;bottom:0;width:100%;height:120%;overflow:hidden;pointer-events:none;z-index:25}
.sth-gain-fog{position:absolute;left:0;bottom:0;width:100%;height:60px;background:linear-gradient(to top,rgba(255,255,255,0.05),rgba(255,255,255,0.5) 40%,rgba(255,255,255,0.1));animation:fogRise 0.9s ease-out forwards}
@keyframes fogRise{0%{opacity:1;transform:translateY(0) scaleX(0.6)}100%{opacity:0;transform:translateY(-55px) scaleX(1.2)}}
.sth-gain{position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:#fff;font-size:10px;font-weight:bold;pointer-events:none;z-index:30;animation:floatUp 1.2s ease-out forwards;text-shadow:0 0 8px rgba(255,255,255,0.7)}
/* 解除隐匿：雾气瞬间炸散 */
.sth-burst{position:absolute;inset:-6px;border-radius:6px;background:radial-gradient(circle,rgba(255,255,255,0.35) 10%,transparent 70%);animation:burstDisperse .4s ease-out forwards;pointer-events:none;z-index:25}
@keyframes burstDisperse{0%{transform:scale(0.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.sth-lose{position:absolute;top:-16px;left:50%;transform:translateX(-50%);color:#faa;font-size:10px;font-weight:bold;pointer-events:none;z-index:30;animation:floatUp 1.2s ease-out forwards;text-shadow:0 0 8px rgba(255,100,100,0.7)}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-22px)}}
.sth-label{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);font-size:8px;color:#ccc;pointer-events:none;z-index:30}
/* 死亡粒子消散 */
.slot.dying{animation:dyingDissolve .6s ease-out forwards;pointer-events:none}
@keyframes dyingDissolve{0%{opacity:1;filter:brightness(1) blur(0)}40%{opacity:.6;filter:brightness(2.5) blur(1px)}100%{opacity:0;filter:brightness(4) blur(4px)}}
.dying-particle{position:absolute;border-radius:50%;pointer-events:none;z-index:20;animation:particleFly .7s ease-out forwards}
@keyframes particleFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(0)}}
/* 恐惧进度条 */
.fear-bar-wrap{position:absolute;left:4px;right:4px;bottom:2px;height:3px;background:rgba(255,255,255,.08);border-radius:2px;z-index:5;overflow:hidden}
.fear-bar-fill{height:100%;background:linear-gradient(90deg,#c80,#fa0);border-radius:2px;transition:width .3s}
.fear-bar-fill.high{background:linear-gradient(90deg,#f60,#f33);animation:fearPulse .6s ease-in-out infinite}
@keyframes fearPulse{0%,100%{opacity:.7}50%{opacity:1}}
.fear-bar-fill.full{background:#f33;animation:fearFlash .3s ease-in-out infinite}
@keyframes fearFlash{0%,100%{opacity:.6}50%{opacity:1}}
/* 首页 */
.home-wrap{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:40px}
.home-btn{width:220px;padding:14px;border-radius:10px;border:2px solid #444;background:#1a1a33;color:#ddd;font-size:15px;cursor:pointer;transition:all .2s}
.home-btn:hover{background:#2a2a44;border-color:#fc0}
.home-btn.dev{background:#1a2a1a;border-color:#3a3}
.home-btn.dev:hover{background:#2a3a2a;border-color:#4f4}
/* 战斗操作面板 */
.battle-panel{display:none;margin:6px auto;max-width:420px;background:#151525;border-radius:6px;border:1px solid #2a2a44;overflow:hidden}
.battle-panel.show{display:flex}
.bp-left{flex:1;padding:6px 8px;min-width:0}
.bp-right{width:140px;padding:6px;background:#0d0d1a;border-left:1px solid #2a2a44;font-size:9px;color:#888;min-height:40px;line-height:1.5}
.bp-name-hp{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.bp-name{font-size:13px;font-weight:bold;color:#fc0}
.bp-hp{font-size:11px;color:#4f4}
.bp-skip{padding:2px 8px;background:#331;border:1px solid #553;border-radius:4px;color:#ca8;font-size:10px;cursor:pointer;white-space:nowrap}
.bp-skip:active{background:#442}
.bp-ailments{margin:3px 0}
.bp-ail-bar{position:relative;height:14px;background:#1a1a2e;border-radius:3px;margin:2px 0;cursor:pointer;font-size:9px;line-height:14px;padding:0 4px;color:#ccc;overflow:hidden}
.bp-ail-bar .fill{position:absolute;left:0;top:0;height:100%;border-radius:3px;transition:width .3s;opacity:.5}
.bp-opt{padding:3px 6px;margin:2px 0;border-radius:4px;cursor:pointer;font-size:10px;background:#1a1a33;border:1px solid #2a2a44;color:#ccc;transition:all .15s}
.bp-opt:hover{background:#2a2a44;border-color:#558}
.bp-opt.hl{border-color:#fc0!important;background:#332200}
.bp-opt.dim{opacity:.35}
.bp-opt.pa{border-color:#448;color:#88f;cursor:pointer;background:#1a1a2e}
.bp-opt.ba{border-color:#a44;color:#faa}
.bp-opt.sk{border-color:#44a;color:#aaf}
.bp-opt.ult{border-color:#a84;color:#ffa}
.bp-desc{font-size:9px;color:#aaa;line-height:1.6;word-break:break-all}
.bp-use-btn{margin-top:6px;padding:3px 12px;background:#2a5;border:none;border-radius:4px;color:#fff;font-size:10px;cursor:pointer;width:100%}
.bp-use-btn:hover{background:#3b6}
.bp-log{margin:4px auto;max-width:420px;max-height:72px;overflow-y:auto;background:#0d0d1a;border:1px solid #2a2a44;border-radius:4px;padding:3px 6px;font-size:9px;color:#777;line-height:1.5;cursor:pointer}
.bp-log .l{color:#aaa;padding:1px 0;border-bottom:1px solid #1a1a2e}
.bp-log .l:last-child{border-bottom:none}
.bp-log .tap{text-align:center;color:#448;font-size:8px;margin-top:2px}
</style></head>
<body>
<div id="app">
<div style="position:fixed;top:4px;right:8px;color:#666;font-size:10px;z-index:100">v1.56</div>

<div id="home" class="phase active">
<h2 style="text-align:center;color:#fc0;font-size:22px;margin:30px 0 10px">八宝舟</h2>
<div class="home-wrap">
<button class="home-btn" onclick="startNormalGame()">正常对战 (5v5)</button>
<button class="home-btn dev" onclick="startDevGame()">开发者模式 (1v5)</button>
<button class="home-btn" onclick="showRules()">📖 规则</button>
<button class="home-btn" onclick="showGuide()">📚 角色图鉴</button>
</div>
</div>

<div id="ban" class="phase">
<h2>🔵 蓝方 BAN（1/4）</h2>
<div class="info">点击角色禁用（共4个）</div>
<div id="banPool" class="grid6"></div>
</div>

<div id="pick" class="phase">
<h2 id="pickTitle"></h2>
<div class="info" id="pickInfo"></div>
<div class="main-grid">
<div class="side-col" id="pickSideL"></div>
<div id="pickBoard"></div>
<div class="side-col" id="pickSideR"></div>
</div>
</div>

<div id="deploy" class="phase">
<h2 id="deployTitle">布阵</h2>
<div class="info" id="deployInfo"></div>
<div class="main-grid">
<div class="side-col" id="deploySideL"></div>
<div id="board"></div>
<div class="side-col" id="deploySideR"></div>
</div>
</div>
<div id="battle" class="phase">
<div id="battleInfo" style="text-align:center;font-size:10px;margin:2px 0"></div>
<div class="main-grid">
<div class="side-col" id="batSideL"></div>
<div id="board2" style="position:relative"></div>
<div class="side-col" id="batSideR"></div>
</div>
<div id="battlePanel" class="battle-panel"></div>
<div id="bpLog" class="bp-log"></div>
<div class="row"><button class="btn" onclick="bSkip()">跳过回合</button><button class="btn" id="btnDummyMove" style="display:none;background:#552" onclick="toggleDummyMove()">📦 调整人机</button><button class="btn" id="btnAddDummy" style="display:none;background:#252" onclick="toggleAddDummy()">+人机</button><button class="btn" id="btnCdMinus" style="display:none;background:#a33" onclick="devCdMinus()">⏱ 全体冷却-1</button><button class="btn" id="btnChgPlus" style="display:none;background:#3a3" onclick="devChgPlus()">⚡ 全体充能+1</button><button class="btn" style="background:#448" onclick="showRules()">📖 规则</button><button class="btn" style="background:#484" onclick="showGuide()">📚 角色图鉴</button></div>
<button class="log-icon" id="logBtn" onclick="showLog()" title="战斗日志">📋</button>
<div class="log-modal" id="logModal"><button class="log-close" onclick="hideLog()">✕</button><div class="log-content" id="logContent"></div></div>
</div>
<div class="log-modal" id="rulesModal"><button class="log-close" onclick="$('rulesModal').style.display='none'">✕</button><div class="log-content" id="rulesContent"></div></div>
<div class="log-modal" id="guideModal"><button class="log-close" onclick="$('guideModal').style.display='none'">✕</button><div class="log-content" id="guideContent"></div></div>

<div id="gameover" class="phase">
<h2 id="winnerText"></h2>
<div class="row"><button class="btn" onclick="location.reload()">重新开始</button></div>
</div>

</div>

<script>
// ===== 24角色数据 =====
const ROSTER=[
{n:'陈色',h:16,a:0,agi:7,cls:'召唤师',pa:'虫迷：场上每存在1只虫子，虫子生命值+1',rg:[[0,0]],sk:[
{tp:'sk',n:'毛毛虫',cd:8,str:4,d:'在己方区域召唤生命值为1的毛毛虫，开局场上无毛毛虫。冷8/存4。',ex:(u,ctx)=>{
let n=u.mc||0;if(n<=0)return ctx.b.lg.push('无可召唤的毛毛虫');
// 进入选位模式
ctx.b.skMode={sk:{tp:'sk',n:'毛毛虫'},tgt:'empty',max:n,placed:0};
ctx.b.lg.push('选择1~'+n+'个空格召唤毛毛虫');
}},
{tp:'ult',n:'虫群',ch:3,d:'对敌方所有单位造成 虫子总血量/敌方单位数量*2 的伤害，己方全体基础攻击力+1，大招开始清空所有毛毛虫，自充3/持1，持续期间无法使用技能。',ex:(u,ctx)=>{
let ws=ctx.b.us.filter(v=>v.isS&&v.mst===u);
let th=ws.reduce((s,w)=>s+w.hp,0);
let x=th*2;
u._ultX=x;
let es=ctx.b.us.filter(v=>v.tm!==u.tm&&v.al);
if(es.length){let d=Math.floor(x/es.length);es.forEach(e=>e.dmg(d));ctx.b.lg.push('虫群:每人'+d+'伤害')}
ctx.b.us.filter(v=>v.tm===u.tm).forEach(v=>v.atk+=1);
ws.forEach(w=>w.al=0);
u.ch=0;u.ultDur=1;u.skDisabled=1;
ctx.b.lg.push('虫群发动!下个自身回合开始时触发二次伤害');
}}

class Ail{constructor(t){this.t=t;this.s=0}add(n,u){this.s+=n;if(this.s>=10){this.s=0;if(u&&u.al&&!u._dying){let d=u.dmg(4);b.lg.push(u.n+' 恐惧结算 4伤')}return 1}return 0}}
function mu(n,h,a,g,t,x,y,m,r,isS,mst,isTree){
let o={n,h,hp:h,mH:h,atk:a,agi:g,tm:t,x,y,mxc:m||5,rg:r||[[0,0]],ch:0,sh:0,al:1,
st:0,bd:0,bl:0,sth:0,tt:0,inv:0,
cd:{},sk:[],cs:0,isS:isS||0,mst:mst||null,isTree:isTree||0,
qi:0,ultA:0,fd:0,intel:0,gru:0,rage:0,form:0,xiaoy:0,chging:0,chgSk:null,
lt:null,tkS:0,idS:0,bns:0,elec:'',imd:0,
mc:0,ultDur:0,skDisabled:0,_uid:Math.random(),backdoorCd:0};
o.ail={neuro:new Ail('neuro',o),fear:new Ail('fear',o),burn:new Ail('burn',o)};
o.dmg=function(v,p){return dmg(this,v,p)};o.heal=function(v){return heal(this,v)};
o.chg=function(n){return chg(this,n)};o.sC=function(k,v){return sCd(this,k,v)};
o.gCd=function(k){return gCd(this,k)};o.cdTk=function(){return cdTk(this)};
o.inRg=function(tx,ty){return inRg(this,tx,ty)};
o.sk=ROSTER.find(r=>r.n===n)?.sk||[];
return o;
}
function dmg(u,v,p){if(!u.al)return 0;if(u.inv)return 0;if(u._dying)return 0;let a=v;if(!p&&u.sh>0){let sb=Math.min(u.sh,a);u.sh-=sb;a-=sb}let hpB=u.hp;u.hp-=a;let r=Math.max(0,u.hp/u.mH);if(!u._hits)u._hits=[];u._hits.push({dmg:v,hpLoss:a,hpBefore:hpB,ratio:r,t:Date.now()});if(u.hp<=0){u.hp=0;u._dying=1}if(u.n==='周水'&&u.al&&!u._dying){u.chg(1);b.lg.push('周水 受击充能+1')}return v}
function heal(u,v){if(u.al)u.hp=Math.min(u.mH,u.hp+v)}
function chg(u,n){if(u.ultDur>0)return;u.ch=Math.min(u.ch+n,u.mxc);}
function sCd(u,k,v){u.cd[k]=v}
function gCd(u,k){return u.cd[k]||0}
function cdTk(u){for(let k in u.cd)if(u.cd[k]>0){u.cd[k]--;if(u.cd[k]===0){let sk=u.sk.find(s=>s.n===k);if(sk&&sk.str){u.mc=Math.min((u.mc||0)+1,sk.str);u.cd[k]=sk.cd;b.lg.push(u.n+' '+k+' 存储+1 ('+u.mc+'/'+sk.str+')')}}}}
function inRg(u,tx,ty){let dx=tx-u.x,dy=ty-u.y;let flip=u.tm==='p2'?-1:1;return u.rg.some(r=>dx===r[0]*flip&&dy===r[1])}
function logF(u,tp,sn,msg){
  let tmL=u.tm==='p1'?'蓝方':'红方';
  let tpL=tp==='ba'?'普攻':tp==='sk'?'技能':tp==='ult'?'大招':'';
  return tmL+u.n+'使用'+tpL+'·'+sn+'：'+msg;}
function lgFmt(){if(!b.logCtx)return'';let u=b.logCtx.u;let tpL=b.logCtx.tp==='ba'?'普攻':b.logCtx.tp==='sk'?'技能':b.logCtx.tp==='ult'?'大招':'';return(b.logCtx.u.tm==='p1'?'蓝方':'红方')+u.n+'使用'+tpL+'·'+b.logCtx.sn;
}

let u=mu(d.n,d.h,d.a,d.agi||0,d.tm,d.x,d.y,d.mxc||5,d.rg||[[0,0]]);

if(u.n==='第五陈色'&&allD.some(v=>v.n==='陈色'&&v.tm===u.tm))u.atk+=1;

if(u.n==='科比牢大')u.bns=0;
b.us.push(u);
});
b.ct='p1';b.rn=1;b._logs=[];b._phase=null;b.logCtx=null;
b.lg={push:function(m){var fm=m;if(b.logCtx){var tmL=b.logCtx.u.tm==='p1'?'蓝方':'红方';var tpL=b.logCtx.tp==='ba'?'普攻':b.logCtx.tp==='sk'?'技能':b.logCtx.tp==='ult'?'大招':'';fm=tmL+b.logCtx.u.n+'使用'+tpL+'·'+b.logCtx.sn+'：'+m;}b._logs.push({r:b._phase?b._phase.r:b.rn,tp:b._phase?b._phase.tp:'act',side:b._phase?b._phase.side:null,msg:fm});},get length(){return b._logs.length;}};

b.go=0;b.sel=null;b.acted=new Set();b.extra=null;b.skMode=null;b._selEnemy=0;b._actedView=0;

b.fE=function(x1,x2,y1,y2){for(let x=Math.max(0,x1);x<=Math.min(6,x2);x++)for(let y=Math.max(1,y1);y<=Math.min(5,y2);y++){if(!this.gU(x,y)&&x!==3)return{x,y}}return null};
setPhase('battle');

let p2a=b.us.filter(u=>u.tm==='p2'&&u.al).reduce((s,u)=>s+u.agi,0);
if(p1a!==p2a)b.ct=p1a>p2a?'p1':'p2';
beginRound();

}

function beginRound(){
if(!b._roundLogged){b.logSection('round');b.lg.push('第'+b.rn+'大回合开始');b._roundLogged=1;b.logSection('side');b.lg.push((b.ct==='p1'?'蓝方':'红方')+'行动');
b.us.filter(u=>u.al&&u.n==='陈色').forEach(u=>u.chg(1));}
// 陈色被动：毛毛虫血量上限=当前存活毛毛虫数+1
b.us.filter(u=>u.al&&u.n==='陈色').forEach(cs=>{
let ws=b.us.filter(v=>v.isS&&v.mst===cs&&v.al);
let cnt=ws.length;
ws.forEach(w=>{w.mH=1+cnt;if(w.hp>w.mH)w.hp=w.mH;});
});
// 周水 后门:隐匿恢复计时
b.us.filter(u=>u.al&&u.n==='周水').forEach(u=>{
if(u.backdoorCd>0){u.backdoorCd--;if(u.backdoorCd===0){u.sth=1;b.lg.push('周水 后门:隐匿恢复');}}
});

// 陈色大招持续
b.us.filter(u=>u.al&&u.ultDur>0).forEach(u=>{
if(b.ct===u.tm){
if(u.ultDur===1){
let es=b.us.filter(v=>v.tm!==u.tm&&v.al);
let x=u._ultX||0;
if(es.length){let d=Math.floor(x/es.length);es.forEach(e=>e.dmg(d));b.lg.push('虫群次级伤害:每人'+d+'伤害')}

}
u.ultDur--;
if(u.ultDur===0){
u.skDisabled=0;u.ch=0;
b.lg.push(u.n+' 虫群结束');
}
}
});
b.us.filter(u=>u.al&&u.bl>0).forEach(u=>{dmg(u,2,1);b.lg.push(u.n+' 流血-2');u.bl--});
b.us.forEach(u=>{u.tt=0;u.bd=Math.max(0,u.bd-1)});
b.acted=new Set();b.sel=null;b.skMode=null;b._selEnemy=0;b._actedView=0;
if(!b.go)checkGO();
if(!b.go){renderBattle();upInfo()}
b.us.forEach(u=>{if(u.n!=='周水'&&u.n!=='陈色')u.sth=Math.max(0,u.sth-1)});

if(b._actedView)return;
// 己方选中→点击敌方→普攻
let cr=b.sel.chging?2:1;let canAtk=isChargeUnit(b.sel)?(
Math.abs(b.sel.y-u.y)<cr&&((b.sel.tm==='p1'&&u.x>b.sel.x)||(b.sel.tm==='p2'&&u.x<b.sel.x))
):b.sel.inRg(u.x,u.y);

function doAction(unit,tp,sk){

if(!hasTarget){
// 无有效目标，直接执行（如丁衍征一的自身技能）
try{
let ctx={b,sel:null};
sk.ex(unit,null,ctx);
}catch(e){
b.lg.push(unit.n+' 范围内无目标');
b.sel=null;b._selEnemy=0;b._actedView=0;renderBattle();return;
}
finishAction(unit);
return;
}
// 进入普攻选目标模式
b.skMode={sk:sk,tgt:'enemy',isBA:1};
renderBattle();upInfo();
return;
}
// 判断是否需要选目标 (ex有3个参数=需要t，或技能名是毛毛虫)
let needsTarget=sk.ex.length===3||sk.n==='毛毛虫';
if(needsTarget){
if(sk.n==='毛毛虫'){
let n=unit.mc||0;
b.skMode={sk:sk,tgt:'empty',max:n,placed:0,newWorms:[]};
}else{
b.skMode={sk:sk,tgt:sk.tp==='ba'||(sk.n==='点赞'||sk.n==='葡萄糖'||sk.n==='飘絮')?'any':'enemy'};
}
renderBattle();upInfo();
return;
}
// 不需要目标，直接执行
let ctx={b,sel:null};
sk.ex(unit,ctx);
finishAction(unit);
}

// ===== 冲锋目标选择 =====
function getChargeTarget(u, bus){
let dir=u.tm==='p1'?1:-1;
// 同列：身前一整行内离自身最近的单位（我方和敌方）
let sameRow=bus.filter(v=>v.al&&v.y===u.y&&((dir===1&&v.x>u.x)||(dir===-1&&v.x<u.x)));
sameRow.sort((a,b)=>dir===1?(a.x-b.x):(b.x-a.x));
if(sameRow.length>0)return sameRow[0];
// 相邻行(y-1, y+1)：身前行内离自身最近的单位
let adjRows=bus.filter(v=>v.al&&(v.y===u.y-1||v.y===u.y+1)&&((dir===1&&v.x>u.x)||(dir===-1&&v.x<u.x)));
adjRows.sort((a,b)=>{let da=Math.abs(a.x-u.x),db=Math.abs(b.x-u.x);return da!==db?da-db:Math.abs(a.y-u.y)-Math.abs(b.y-u.y)});
if(adjRows.length>0)return adjRows[0];
return null;
}
function isChargeUnit(u){
let e=ROSTER.find(r=>r.n===u.n);
if(e&&e.cls==='冲锋手')return true;
// 检查是否有冲锋相关技能或BA带charge标记
let hasChargeSkill=u.sk.some(s=>(s.tp==='ba'&&s.charge)||s.n.includes('冲锋')||s.n.includes('千鸟')||s.n.includes('扶摇'));
if(hasChargeSkill)return true;
// 检查 chging 状态
if(u.chging)return true;
return false;
}

function getChargeRows(unit, bus){
// 返回冲锋可选的行号数组 + 是否仅同行
let dir=unit.tm==='p1'?1:-1;
let sameHas=bus.some(v=>v.tm!==unit.tm&&v.al&&!v.sth&&v.y===unit.y&&((dir===1&&v.x>unit.x)||(dir===-1&&v.x<unit.x)));
if(sameHas)return {rows:[unit.y],sameOnly:1};
let adj=[unit.y];
if(unit.y-1>=1)adj.push(unit.y-1);
if(unit.y+1<=5)adj.push(unit.y+1);
return {rows:adj,sameOnly:0};
}

function switchTeam(){
if(!b.us.some(u=>u.tm==='p1'&&u.al)||!b.us.some(u=>u.tm==='p2'&&u.al)){checkGO();return}
if(b.extra){
let eu=b.extra;b.extra=null;
if(eu.al&&eu.tm===b.ct){b.acted.delete(eu._uid);b.lg.push(eu.n+' 额外行动!');b.sel=null;b.skMode=null;b._selEnemy=0;b._actedView=0;renderBattle();upInfo();return}
}
// 小回合结束：自动大招（按敏捷降序）
let autoUnits=b.us.filter(u=>u.al&&u.ch>=u.mxc).sort((a,b)=>b.agi-a.agi);
for(let u of autoUnits){
let au=u.sk.find(s=>s.tp==='ult'&&s.auto);
if(au){
b.lg.push(u.n+' 充能满自动释放·'+au.n);
b.logCtx={u:u,tp:'ult',sn:au.n};
au.ex(u,{b:b,us:b.us});
b.logCtx=null;
}
}
b.ct=b.ct==='p1'?'p2':'p1';
b.logSection('side');b.lg.push((b.ct==='p1'?'蓝方':'红方')+'行动');
if(b.ct==='p1'){b.lg.push('第'+(b.rn-1)+'大回合结束');b._roundLogged=0;
b.rn++;
// 进入选位阶段
startReposition();
return;
}
// 切换到p2: 如果dev mode且红方是dummy，自动全跳过
if(b.ct==='p2'&&b.us.some(u=>u.isDummy)){
let dummies=b.us.filter(u=>u.al&&u.tm===b.ct&&u.isDummy&&!b.acted.has(u._uid));
dummies.forEach(u=>{b.acted.add(u._uid);b.us.filter(v=>v.al).forEach(v=>v.cdTk());});
b.lg.push('人机自动跳过');
switchTeam();
return;
}
b.sel=null;b.skMode=null;b._selEnemy=0;b._actedView=0;
beginRound();
if(!b.go){renderBattle();upInfo()}
}

// ===== 选位阶段 =====
let repoStep=0,repoCur=null,repoOrder=[],repoFirst='',repoPool=[];

function startReposition(){
b.sel=null;b.skMode=null;b.acted=new Set();b._selEnemy=0;b._actedView=0;
let p1u=b.us.filter(u=>u.al&&u.tm==='p1');let p2u=b.us.filter(u=>u.al&&u.tm==='p2');
let p1a=p1u.reduce((s,u)=>s+u.agi,0);let p2a=p2u.reduce((s,u)=>s+u.agi,0);
let reason='敏捷';
if(p1a!==p2a){repoFirst=p1a>p2a?'p1':'p2';}else{
let p1hp=p1u.reduce((s,u)=>s+u.mH,0);let p2hp=p2u.reduce((s,u)=>s+u.mH,0);
if(p1hp!==p2hp){repoFirst=p1hp<p2hp?'p1':'p2';reason='HP上限更低';}else{
let p1atk=p1u.reduce((s,u)=>s+u.atk,0);let p2atk=p2u.reduce((s,u)=>s+u.atk,0);
repoFirst=p1atk>=p2atk?'p1':'p2';reason='攻击力更高';
}}
b.logRepo();b.lg.push('第'+b.rn+'大回合选位');
let label=repoFirst==='p1'?'🔵蓝方':'🔴红方';
b.lg.push(label+' 先选位 ('+reason+':'+(repoFirst==='p1'?p1a:p2a)+')');
let sc=repoFirst==='p1'?'p2':'p1';
repoOrder=[repoFirst,sc,sc,repoFirst,repoFirst,sc,sc,repoFirst,repoFirst,sc];
repoPool=b.us.filter(u=>u.al&&!u.isS&&!u.isDummy);
repoPool.forEach(u=>{u.x=-1;u.y=-1});
repoStep=0;repoCur=null;
setPhase('deploy');
renderReposition();
}

function renderReposition(){
while(repoStep<10){
let cur=repoOrder[repoStep];
let avail=repoPool.filter(u=>u.al&&u.tm===cur&&u.x<0);
if(avail.length>0)break;
repoStep++;
}
if(repoStep>=10){confirmReposition();return}

let cur=repoOrder[repoStep];
let label=cur==='p1'?'🔵蓝方':'🔴红方';
let isDummy=b.us.some(u=>u.isDummy);
$('deployTitle').textContent=label+' 布阵 ('+(repoStep+1)+'/10)';
$('deployInfo').textContent='第'+b.rn+'回合选位 - 点击角色→点击空格放置';
let brd=$('board');brd.innerHTML='';
let allOcc=b.us.filter(u=>u.al&&u.x>=0);
let placed=repoPool.filter(u=>u.x>=0);
for(let x=0;x<7;x++)for(let y=1;y<6;y++){
let slot=document.createElement('div');slot.className='slot';
if(x===3)slot.classList.add('mid');
else if(x<3)slot.classList.add('p1');
else slot.classList.add('p2');
slot.style.left=(x*42+4)+'px';slot.style.top=((y-1)*42+4)+'px';
slot.dataset.x=x;slot.dataset.y=y;
let u=allOcc.find(v=>v.x===x&&v.y===y)||placed.find(v=>v.x===x&&v.y===y);
if(u){slot.innerHTML='<span class="n">'+u.n.substring(0,2)+'</span><span class="hp">'+u.hp+'/'+u.mH+'</span>';slot.classList.add('unit')}
let valid=x<3?cur==='p1':(x>3?cur==='p2':false);
if(!u&&valid){
if(repoCur)slot.classList.add('ready');
slot.onclick=()=>{
if(!repoCur)return;
if(allOcc.find(v=>v.x===x&&v.y===y))return;
repoCur.x=x;repoCur.y=y;
repoCur=null;repoStep++;
renderReposition();
};
}
brd.appendChild(slot);
}
// 侧栏：双方已选+未选角色
let sl=$('deploySideL'),sr=$('deploySideR');
sl.innerHTML='';sr.innerHTML='';
repoPool.filter(u=>u.tm==='p1').forEach(u=>{
let el=document.createElement('div');
let isPl=u.x>=0;
el.className='side-cell p1'+(isPl?' placed':'');
el.textContent=u.n.substring(0,2);
el.title=u.n+' HP:'+u.hp;
if(!isPl&&cur==='p1'){
el.onclick=()=>{
if(repoCur===u){repoCur=null;renderReposition();return}
repoCur=u;renderReposition();
};el.classList.add('pick');
}
if(repoCur===u)el.classList.add('current');
sl.appendChild(el);
});
while(sl.children.length<5){let c=document.createElement('div');c.className='side-cell';c.style.opacity='0.3';c.textContent='-';sl.appendChild(c);}
repoPool.filter(u=>u.tm==='p2').forEach(u=>{
let el=document.createElement('div');
let isPl=u.x>=0;
el.className='side-cell p2'+(isPl?' placed':'');
el.textContent=u.n.substring(0,2);
el.title=u.n+' HP:'+u.hp;
if(!isPl&&cur==='p2'){
el.onclick=()=>{
if(repoCur===u){repoCur=null;renderReposition();return}
repoCur=u;renderReposition();
};el.classList.add('pick');
}
if(repoCur===u)el.classList.add('current');
sr.appendChild(el);
});
while(sr.children.length<5){let c=document.createElement('div');c.className='side-cell';c.style.opacity='0.3';c.textContent='-';sr.appendChild(c);}
// 可选角色（仅侧栏，无下方角色条）
let avail=repoPool.filter(u=>u.al&&u.tm===cur&&u.x<0);
let humanU=avail.filter(u=>!u.isDummy);
let dummyU=avail.filter(u=>u.isDummy);
if(isDummy&&humanU.length===0&&dummyU.length>0){
let d=dummyU[0];
let sx=cur==='p1'?0:4,ex=cur==='p1'?2:6;
for(let x=sx;x<=ex;x++)for(let y=1;y<=5;y++){
if(!allOcc.some(v=>v.x===x&&v.y===y)&&!placed.some(v=>v.x===x&&v.y===y)){d.x=x;d.y=y;break}
}
repoStep++;renderReposition();return;
}
}

setPhase('battle');
beginRound();
renderBattleSides();
if(!b.go){renderBattle();upInfo()}
}

function renderBattleSides(){
let sl=$('batSideL'),sr=$('batSideR');
sl.innerHTML='';sr.innerHTML='';
let p1u=b.us.filter(u=>u.tm==='p1'&&!u.isS);
if(p1pick.length>0)p1u.sort((a,b)=>(p1pick.indexOf(a._pi)-p1pick.indexOf(b._pi)));

p1u.forEach(u=>{

c.className='side-cell p1'+(u.al?'':' dead');

while(sl.children.length<5){let c=document.createElement('div');c.className='side-cell';c.style.opacity='0.2';c.textContent='-';sl.appendChild(c);}

function bpClick(tp,sn){
if(!b.sel)return;
document.querySelectorAll('.bp-opt').forEach(o=>o.classList.remove('hl'));
let tgt=document.querySelector('.bp-opt.'+(tp==='ba'?'ba':tp==='sk'?'sk':tp==='ult'?'ult':'pa'));
if(tgt)tgt.classList.add('hl');
let desc='',sk=null,avail=false;
if(tp==='pa'){desc=b.sel.pa||'无被动描述';_bpSelAction=null;}
else{
sk=b.sel.sk.find(s=>s.tp===tp&&s.n===sn);
if(!sk)return;
desc=sk.d||(sk.n+'：无详细描述');
if(b._selEnemy||b._actedView){_bpSelAction=null;}
else{
if(tp==='ba'){avail=b.sel.atk>0;}
else if(tp==='sk'){if(sn==='毛毛虫')avail=(b.sel.mc||0)>0&&!b.sel.skDisabled;else{let cd=b.sel.gCd(sn);avail=cd<=0&&(!sk.ch||b.sel.ch>=sk.ch)&&!b.sel.skDisabled;}}
else{avail=!sk.auto&&b.sel.ch>=b.sel.mxc&&!b.sel.skDisabled;}
_bpSelAction=avail?{tp:tp,sn:sn,sk:sk}:null;
}
}
let bd=$('bpDesc');if(!bd)return;
let h=desc;
if(avail)h+='<br><button class="bp-use-btn" onclick="bpUse()">使用</button>';
bd.innerHTML=h;
}
function bpUse(){if(!_bpSelAction||!b.sel)return;b.logCtx=null;doAction(b.sel,_bpSelAction.tp,_bpSelAction.sk);_bpSelAction=null;}

function showRules(){
var h='<div class="cl-hdr">八宝舟 总体规则</div>';
h+='<p style="font-size:13px;color:#aaa;margin:2px 0">第一部分 全局规则</p>';
h+='<p><b>一 基础设定</b><br>';
h+='游戏类型：双人回合制战棋策略对战游戏<br>';
h+='获胜条件：全歼敌方所有作战单位，敌方主动认输投降</p>';
h+='<p><b>二 回合结构</b><br>';
h+='完整大回合：准备阶段 → 双方交替进行若干小回合 → 结算结束阶段<br>';
h+='单个小回合流程：回合开始 → 行动结算 → 回合结束<br>';
h+='小回合定义：任意方角色进行操作的一个回合。一个大回合通常包括5（我方）+5（敌方）=10个小回合（不计额外回合）</p>';
h+='<p><b>三 开局与单位布阵</b><br>';
h+='<b>1 禁选规则：</b>对局选人阶段开启禁用环节，双方合计可以禁用4名角色。禁用顺序：1号玩家 → 2号玩家 → 2号玩家 → 1号玩家。被禁用角色本局无法出战<br>';
h+='<b>2 选将规则：</b>同一个角色仅能被一方选择，选定后另一方不可重复选择。选人顺序：1→2→2→1→1→2→2→1→1→2<br>';
h+='<b>3 棋盘与站位：</b>7×5格（x:0~6, y:1~5），中线x=3分隔蓝方(p1)和红方(p2)。初始仅己方区域可布阵，公共区域任何单位不能在上面<br>';
h+='<b>4 攻击规则：</b>角色仅能攻击自身攻击范围内的敌方单位（冲锋可攻击友方单位）。攻击优先级：优先攻击同列距离最近的敌人（但也要自主选择），存在多个目标可自主选择，嘲讽等特殊效果可以改变攻击目标逻辑</p>';
h+='<p><b>四 行动与先手判定</b><br>';
h+='<b>1 大回合先手判定（三级）：</b>全队总敏捷更高 → HP上限更低 → 攻击力更高<br>';
h+='<b>2 行动顺序：</b>大回合行动顺序由先手权决定，队内自定义己方小回合行动顺序<br>';
h+='<b>3 小回合规则：</b>主动技能、普攻、大招（非自动释放型）仅能在自身小回合释放，操作后直接结束当前小回合。可跳过对应角色的小回合</p>';
h+='<p><b>五 单位与生存规则</b><br>';
h+='单位：角色本体和召唤物统称为单位。<br>';
h+='死亡判定：单位HP≤0时判定阵亡并离场。<br>';
h+='召唤物：不可被选中、可视为攻击目标、不占行动次数，单格最多1个</p>';
h+='<p><b>六 负面战斗状态</b><br>';
h+='已实现：隐匿、流血、护盾、眩晕（部分）、恐惧<br>';
h+='未实现：嘲讽、束缚、蓄力<br>';
h+='隐匿：无法被单体锁定，群体伤害正常。获得（白雾+文字）/持有（半透明+粒子+"隐匿"小字）/解除（雾气炸散+"破隐"）<br>';
h+='流血：每大回合开局扣2HP<br>';
h+='护盾：受击优先抵扣护盾</p>';
h+='<p><b>七 伤害与损伤体系</b><br>';
h+='<b>1 基础伤害：</b>攻击力×倍率，小数向下取整<br>';
h+='<b>2 损伤叠层：</b>累计10点后清空触发特效，不同类型单独统计，不直接扣血。先结算血量损耗再判损伤<br>';
h+='<b>3 损伤效果（上限各10）：</b>神经（2伤+眩晕）/恐惧（4伤）/燃烧（2伤+后续3大回合末各-1HP）<br>';
h+='<b>4 特殊机制：</b>冲锋（身前全行，可打友方，无目标→身前3行）。贯穿/防反/延时：未实现。回血扣血同时优先回血：未实现</p>';
h+='<p><b>八 范围规则</b><br>';
h+='周围4格：↑↓←→ ｜ 周围8格：3×3九宫格<br>';
h+='所有攻击优先打x坐标离自身最近的</p>';
h+='<hr style="border-color:#333;margin:10px 0">';
h+='<p style="font-size:13px;color:#aaa;margin:2px 0">第二部分 角色通用规则</p>';
h+='<p><b>一 技能分类</b><br>';
h+='被动【被】：无冷却、无充能、自动触发<br>';
h+='普攻冷0存0：ATK=0无法使用<br>';
h+='常规技能冷X存Y：有冷却无充能<br>';
h+='大招（自充/受充/攻充）：无冷却，充能满释放<br>';
h+='操作 = 普攻/技能/大招的总称</p>';
h+='<p><b>二 执行顺序</b><br>';
h+='被动 → 普攻 → 技能 → 大招</p>';
h+='<p><b>三 词条释义</b><br>';
h+='冷：每个小回合开始（切换行动方时）-1，归零可用<br>';
h+='存：标记str:N，冷却归零储存+1，冷却重置至上限<br>';
h+='持：大招持续回合数（未实现通用化）</p>';
h+='<p><b>四 大招充能规则</b><br>';
h+='自充（自身小回合+1，除周水外均采用）/攻充（命中+1）/受充（受击+1，如周水）<br>';
h+='充能满后在小回合结束阶段自动释放（多单位按敏捷降序）<br>';
h+='持续大招期间无法充能</p>';
h+='<hr style="border-color:#333;margin:10px 0">';
h+='<p style="font-size:13px;color:#aaa;margin:2px 0">第三部分 角色专属规则（详见角色图鉴）</p>';
$('rulesContent').innerHTML=h;
$('rulesModal').style.display='flex';
}
